<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <title>Space Scene + Profile + Alien Explorer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 20px;
      letter-spacing: 0.5px;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 1));
    }
  </style>
</head>

<body>
  <div id="loading">Loading…</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>

  <script>
    console.log("✅ script loaded");

    // ===== Renderer + Scene + Camera =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 10000);
    camera.position.set(2300, 1620, 4330);

    // ===== Controls =====
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(-1000, 1200, 3700);
    controls.enableRotate = false;
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.maxDistance = 10000;
    controls.minDistance = 100;
    controls.maxPolarAngle = Math.PI / 1.5;
    controls.enableDamping = false;
    controls.dampingFactor = 0.1;
    controls.screenSpacePanning = false;

    // ===== Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
    sunLight.position.set(50, 100, 50);
    scene.add(sunLight);

    // ===== HDRI =====
    const HDR_URL = "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/qwantani_night_puresky_4k.hdr";
    const rgbeLoader = new THREE.RGBELoader();
    rgbeLoader.setDataType(THREE.UnsignedByteType);
    rgbeLoader.load(HDR_URL, (hdrTexture) => {
      hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
      scene.background = hdrTexture;
      scene.environment = hdrTexture;
      console.log("🌌 HDR Loaded → Loading space_2.obj...");
      loadSpaceScene();
    });

    // ===== PBR =====
    function createPBR(base, rough, metal, normal, ao, opt = {}) {
      const tex = new THREE.TextureLoader();
      const path = "https://pollakritlu.github.io/project_comgraph/textures/";

      const mat = new THREE.MeshStandardMaterial({
        roughness: 1.0,
        metalness: 0.2,
        transparent: !!opt.transparent,
        opacity: opt.opacity != null ? opt.opacity : 1.0,
        emissive: opt.emissive ? new THREE.Color(...opt.emissive) : 0x000000,
        emissiveIntensity: opt.emissiveIntensity || 1.0,
        side: THREE.DoubleSide
      });

      if (opt.roughness != null) mat.roughness = opt.roughness;
      if (opt.metalness != null) mat.metalness = opt.metalness;

      const loadMap = (name) => {
        const t = tex.load(path + name, (tt) => { tt.flipY = false; });
        return t;
      };
      if (base) {
        mat.map = loadMap(base);
        mat.map.encoding = THREE.sRGBEncoding;
      }
      if (rough) mat.roughnessMap = loadMap(rough);
      if (metal) mat.metalnessMap = loadMap(metal);
      if (normal) {
        mat.normalMap = loadMap(normal);
        mat.normalScale.set(1, 1);
      }
      if (ao) mat.aoMap = loadMap(ao);

      return mat;
    }

    // ===== load space_2.obj + textures =====
    function loadSpaceScene() {
      const objLoader = new THREE.OBJLoader();
      objLoader.setPath("https://pollakritlu.github.io/project_comgraph/");

      const materialMap = {
        "Mount": { base: "gltf_embedded_45.png", rough: "gltf_embedded_13_channels_B.png", metal: "gltf_embedded_46_channels_G.png", normal: "gltf_embedded_47.png" },
        "Trava": { base: "gltf_embedded_66.png", rough: "gltf_embedded_67_channels_G.png" },
        "1sTONEnEW": { base: "gltf_embedded_9.png", rough: "gltf_embedded_9.png", normal: "gltf_embedded_11.png", opt: { metalness: 0.8, roughness: 0.2 } },
        "SaturnRings": { base: "gltf_embedded_54.png" },
        "Fire": { base: "gltf_embedded_47.png", opt: { emissive: [1, 0.3, 0], emissiveIntensity: 3 } },
        "Man.001": { base: "gltf_embedded_39.png" },
        "Ship.003": { base: "gltf_embedded_60.png" },
        "Glass.001": { opt: { metalness: 1.0, rough: 0 } },
        "Cloth.001": { base: "gltf_embedded_18.png", rough: "gltf_embedded_18.png", normal: "gltf_embedded_20.png" },
        "Cloth2.001": { base: "gltf_embedded_21.png", rough: "gltf_embedded_21.png", normal: "gltf_embedded_23.png" },
        "Material.001": { base: "gltf_embedded_42.png", normal: "gltf_embedded_44.png" },
        "Lamki.001": { base: "gltf_embedded_12.png", rough: "gltf_embedded_12.png", normal: "gltf_embedded_14.png" },
        "Bag.001": { base: "gltf_embedded_12.png", rough: "gltf_embedded_12.png", normal: "gltf_embedded_14.png" },
        "Boti.001": { base: "gltf_embedded_14.png", rough: "gltf_embedded_46_channels_B.png", metal: "gltf_embedded_46_channels_G.png", normal: "gltf_embedded_47.png" },
        "Osheinik.001": { base: "gltf_embedded_51.png", normal: "gltf_embedded_50.png" },
        "tiger-edit": { base: "gltf_embedded_63.png" },
        "None": { base: "gltf_embedded_48.png" }
      };

      objLoader.load("space_2.obj", (object) => {
        console.log("🛰 space_2.obj loaded");

        object.traverse((child) => {
          if (!child.isMesh) return;
          const matData = materialMap[child.material.name];
          if (matData) {
            child.material = createPBR(
              matData.base, matData.rough, matData.metal, matData.normal, matData.ao, matData.opt
            );
          } else {
            child.material = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 1 });
          }
        });

        object.scale.set(100, 100, 100);
        scene.add(object);
        loadProfileOBJ();
      },
        (xhr) => {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById("loading").textContent = `Loading Space Scene… ${percent}%`;
        },
        (err) => console.error("❌ Load space_2.obj failed:", err));
    }

    // ===== load Alien Explorer OBJ + MTL =====
    let alienModel;
    function loadAlienExplorer() {
      const mtlLoader = new THREE.MTLLoader();
      mtlLoader.setPath("https://pollakritlu.github.io/project_comgraph/");
      mtlLoader.load("alien_explorer_only.mtl", (materials) => {
        materials.preload();
        const objLoader = new THREE.OBJLoader();
        objLoader.setMaterials(materials);
        objLoader.setPath("https://pollakritlu.github.io/project_comgraph/");
        objLoader.load("alien_explorer_only.obj", (alien) => {
          console.log("👽 Alien Explorer loaded");
          alien.scale.set(250, 250, 250);
          alien.position.set(-602.1, 1268.6, 4693.6);
          alien.rotation.y = Math.PI / 3;
          scene.add(alien);
          alienModel = alien;
        },
          (xhr) => {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            document.getElementById("loading").textContent = `Loading Alien Explorer… ${percent}%`;
          },
          (err) => console.error("❌ Load alien_explorer.obj failed:", err));
      });
    }

    // ===== load Profile OBJ =====
    function loadProfileOBJ() {
      const profileLoader = new THREE.OBJLoader();
      profileLoader.setPath("https://pollakritlu.github.io/project_comgraph/");

      profileLoader.load("Profile.obj", (profile) => {
        console.log("🧍 Profile.obj loaded");
        profile.scale.set(250, 250, 250);

        const photoTexture = new THREE.TextureLoader().load("https://pollakritlu.github.io/project_comgraph/textures/profile.jpg");
        photoTexture.flipY = false;

        profile.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              map: photoTexture,
              metalness: 0.1,
              roughness: 0.7
            });
          }
        });

        scene.add(profile);
        document.getElementById("loading").textContent = "✅ โหลดเสร็จแล้ว!";
        setTimeout(() => document.getElementById("loading").style.display = "none", 1000);
        loadAlienExplorer();
        loadFontObjects();
        animate();
      },
        (xhr) => {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById("loading").textContent = `Loading Profile… ${percent}%`;
        },
        (err) => console.error("❌ Load Profile.obj failed:", err));
    }

    // ===== load button =====
    function loadFontObjects() {
      const loader = new THREE.OBJLoader();
      loader.setPath("https://pollakritlu.github.io/project_comgraph/");

      const TRANSFORM_ORDER = ["drive", "back1", "back2", "project", "credit", "aboutme"];

      const objects = {};

      const POSITIONS = {
        drive: [-86.0, -15.0, 110.0],
        back1: [-60.0, -6.0, -1.7],
        back2: [-371.0, 0.0, 125.0],
        project: [-1000.0, -2700.0, -1300.0],
        credit: [-1000.0, -2700.0, -1320.0],
        aboutme: [-1000.0, -2700.0, -1310.0]
      };

      const CAMERA_POSITIONS = {
        drive: {
          camera: [-880, 1380, 3950],
          target: [-1110.0, 1200.0, 4800.0]
        },
        back1: {
          camera: [2300, 1620, 4330],
          target: [-1000, 1200, 3700]
        },
        back2: {
          camera: [2300, 1620, 4330],
          target: [-1000, 1200, 3700]
        },
        project: {
          camera: [-879.4, 1424.4, 4050.7],
          target: [-1086.9, 1261.9, 4799.8]
        },
        credit: {
          camera: [144.5, 147.2, 18.7],
          target: [119.8, 90.8, 577.7]
        },
        aboutme: {
          camera: [-237, 66, 103],
          target: [-56.0, 42.0, -5.0]
        }
      };

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let hoveredObject = null;

      // Mouse move event for hover effect
      renderer.domElement.addEventListener('mousemove', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(objects), true);

        // Reset previous hovered object
        if (hoveredObject) {
          hoveredObject.traverse((child) => {
            if (child.isMesh && child.userData.originalColor) {
              child.material.emissive.setHex(0x000000);
              child.material.emissiveIntensity = 0;
            }
          });
          document.body.style.cursor = 'default';
          hoveredObject = null;
        }

        // Set new hovered object
        if (intersects.length > 0) {
          let currentObj = intersects[0].object;
          while (currentObj.parent) {
            if (objects[currentObj.name]) {
              hoveredObject = currentObj;
              break;
            }
            currentObj = currentObj.parent;
          }

          if (hoveredObject) {
            hoveredObject.traverse((child) => {
              if (child.isMesh) {
                child.material.emissive.setHex(0xff00ff);
                child.material.emissiveIntensity = 0.5;
              }
            });
            document.body.style.cursor = 'pointer';
          }
        }
      });

      renderer.domElement.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(Object.values(objects), true);

        if (intersects.length > 0) {
          let objectName = null;
          let currentObj = intersects[0].object;

          while (currentObj.parent) {
            if (objects[currentObj.name]) {
              objectName = currentObj.name;
              break;
            }
            currentObj = currentObj.parent;
          }

          if (objectName && CAMERA_POSITIONS[objectName]) {
            const config = CAMERA_POSITIONS[objectName];
            const cameraPos = new THREE.Vector3(...config.camera);
            const targetPos = new THREE.Vector3(...config.target);

            lerpCamera(cameraPos, targetPos, 2000);
          }
        }
      });

      TRANSFORM_ORDER.forEach((name) => {
        const filename = `${name}.obj`;

        loader.load(
          filename,
          (obj) => {
            console.log(`✅ Loaded: ${filename}`);

            obj.name = name;
            objects[name] = obj;

            const pos = POSITIONS[name];
            obj.position.set(pos[0], pos[2], pos[1]);

            obj.scale.set(100, 100, 100);

            obj.traverse((child) => {
              if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                  color: 0xffffff,
                  metalness: 0.2,
                  roughness: 0.7,
                  emissive: new THREE.Color(0x000000)
                });

                child.userData.originalColor = child.material.color.clone();
              }
            });

            scene.add(obj);
          },
          undefined,
          (err) => console.error(`❌ Failed to load ${filename}`, err)
        );
      });
    }

    // ===== Lerp Camera Position and Target =====
    function lerpCamera(targetCameraPos, targetControlsTarget, duration) {
      const startCameraPos = camera.position.clone();
      const startControlsTarget = controls.target.clone();
      const startTime = performance.now();

      function updateCameraPosition() {
        const elapsedTime = performance.now() - startTime;
        const t = Math.min(elapsedTime / duration, 1);

        const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

        camera.position.lerpVectors(startCameraPos, targetCameraPos, eased);
        controls.target.lerpVectors(startControlsTarget, targetControlsTarget, eased);

        if (t < 1) {
          requestAnimationFrame(updateCameraPosition);
        }
      }

      updateCameraPosition();
    }

    // Debug Camera Position Overlay
    //    const camDebug = document.createElement('div');
    //  camDebug.style.position = 'fixed';
    // camDebug.style.bottom = '10px';
    //camDebug.style.left = '10px';
    //camDebug.style.background = 'rgba(0,0,0,0.7)';
    //camDebug.style.color = '#fff';
    //camDebug.style.fontFamily = 'monospace';
    //camDebug.style.fontSize = '14px';
    //camDebug.style.padding = '6px 10px';
    //camDebug.style.borderRadius = '6px';
    //camDebug.style.zIndex = '9999';
    //document.body.appendChild(camDebug);

    //function updateCamDebug() {
    //const pos = camera.position;
    //const tgt = controls.target;
    // camDebug.textContent = `Camera Position: [${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}]\nTarget: [${tgt.x.toFixed(1)}, ${tgt.y.toFixed(1)}, ${tgt.z.toFixed(1)}]`;
    // }

    // ===== Animate Function =====
    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      controls.update();
//      updateCamDebug();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // ===== Resize =====
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
